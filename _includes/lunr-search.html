{%- comment -%}
  Search UI. The index lives at /search.json and is fetched, along with lunr
  itself, only when someone actually searches.
{%- endcomment -%}

<form id="search-form" class="mb-3" role="search">
  <div class="input-group">
    <input type="search" class="form-control" id="search-input" name="q" maxlength="255"
           autocomplete="off" placeholder="{% t search.placeholder %}" aria-label="{% t search.placeholder %}">
    <button class="btn btn-primary" type="submit">{% t search.submit %}</button>
  </div>
</form>

<div id="search-status" class="text-muted" role="status" aria-live="polite"></div>
<ol id="search-results" class="list-unstyled mt-3"></ol>

<script>
(function () {
  var INDEX_URL = {{ '/search.json' | prepend: site.baseurl | jsonify }};
  var LUNR_URL  = "https://unpkg.com/lunr@2.3.9/lunr.js";
  {%- capture s_loading %}{% t search.loading %}{% endcapture -%}
  {%- capture s_failed %}{% t search.failed %}{% endcapture -%}
  {%- capture s_results_for %}{% t search.results_for %}{% endcapture -%}
  {%- capture s_none %}{% t search.none %}{% endcapture -%}
  var STRINGS = {
    loading:    {{ s_loading     | strip | jsonify }},
    failed:     {{ s_failed      | strip | jsonify }},
    resultsFor: {{ s_results_for | strip | jsonify }},
    none:       {{ s_none        | strip | jsonify }}
  };

  var form    = document.getElementById("search-form");
  var input   = document.getElementById("search-input");
  var status  = document.getElementById("search-status");
  var results = document.getElementById("search-results");

  var ready = null; // Promise<{idx, docs}>, created on first search

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = src;
      s.onload = resolve;
      s.onerror = function () { reject(new Error("failed to load " + src)); };
      document.head.appendChild(s);
    });
  }

  function build() {
    if (ready) return ready;
    status.textContent = STRINGS.loading;

    ready = Promise.all([
      fetch(INDEX_URL).then(function (r) {
        if (!r.ok) throw new Error("index " + r.status);
        return r.json();
      }),
      window.lunr ? Promise.resolve() : loadScript(LUNR_URL)
    ]).then(function (out) {
      var docs = out[0];
      var idx = lunr(function () {
        this.ref("id");
        this.field("title", { boost: 10 });
        this.field("category");
        this.field("body");
        docs.forEach(function (doc, i) {
          doc.id = i;
          this.add(doc);
        }, this);
      });
      return { idx: idx, docs: docs };
    }).catch(function (err) {
      ready = null; // let the next attempt retry
      throw err;
    });

    return ready;
  }

  function snippet(text, len) {
    if (!text) return "";
    return text.length > len ? text.slice(0, len).trim() + "…" : text;
  }

  function render(term, matches, docs) {
    results.textContent = "";

    if (!matches.length) {
      status.textContent = STRINGS.none;
      return;
    }

    status.textContent = STRINGS.resultsFor + " “" + term + "” (" + matches.length + ")";

    matches.forEach(function (m) {
      var doc = docs[Number(m.ref)];

      var li = document.createElement("li");
      li.className = "mb-4";

      var h = document.createElement("h3");
      h.className = "h5 mb-1";

      var a = document.createElement("a");
      a.href = doc.url;
      a.className = "text-decoration-none";
      a.textContent = doc.title;
      h.appendChild(a);
      li.appendChild(h);

      if (doc.category || doc.date) {
        var meta = document.createElement("p");
        meta.className = "small text-muted mb-1";
        meta.textContent = [doc.category, doc.date].filter(Boolean).join(" · ");
        li.appendChild(meta);
      }

      var body = document.createElement("p");
      body.className = "mb-0";
      body.textContent = snippet(doc.body, 180);
      li.appendChild(body);

      results.appendChild(li);
    });
  }

  function run(term) {
    term = (term || "").trim();
    if (!term) {
      results.textContent = "";
      status.textContent = "";
      return;
    }

    build().then(function (state) {
      var matches;
      try {
        matches = state.idx.search(term);
      } catch (e) {
        // lunr throws on malformed query syntax (a lone "~", say) — fall back
        // to treating the whole thing as a literal term.
        matches = state.idx.query(function (q) {
          q.term(lunr.tokenizer(term), { usePipeline: true });
        });
      }
      render(term, matches, state.docs);
    }).catch(function () {
      results.textContent = "";
      status.textContent = STRINGS.failed;
    });
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var term = input.value;
    var url = new URL(window.location.href);
    url.searchParams.set("q", term);
    window.history.replaceState(null, "", url);
    run(term);
  });

  // Support linking straight to a query: /search/?q=poetry
  var initial = new URLSearchParams(window.location.search).get("q");
  if (initial) {
    input.value = initial;
    run(initial);
  }
})();
</script>
