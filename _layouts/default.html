<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
    <head>
        {% include head.html %}
    </head>
    <body>
        <div class="blog-header bg-light">
            {% include header.html %}
        </div>
        {{ content }}
        {% include footer.html %}
        {% comment %}
          Bootstrap's JS bundle (80 KB, plus Popper) was loaded from a CDN for
          exactly two things: the collapsing mobile menu and the language
          dropdown. nav.js does both.
        {% endcomment %}
        <script src="/assets/js/nav.js" defer></script>
        <script src="/assets/js/theme.js" defer></script>
    </body>
</html>
